# Infra checks (D10): static checks always; a read-only plan once the bootstrap
# variables exist. There is no apply job: apply/destroy run only from the laptop (make).
name: infra

on:
  pull_request:
    paths: &infra-paths
      - "infra/**"
      - ".github/workflows/infra.yml"
  push:
    branches: [main]
    paths: *infra-paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load pinned tool versions
        run: grep -E '^[A-Z_]+=' tool-versions.env >> "$GITHUB_ENV"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
      - name: fmt -check, init -backend=false + validate (both stacks), tflint --recursive
        env:
          GITHUB_TOKEN: ${{ github.token }} # tflint --init downloads the aws ruleset
        run: scripts/lint.sh terraform

  plan:
    needs: static
    if: >-
      vars.AWS_PLAN_ROLE_ARN != '' && vars.TF_STATE_BUCKET != '' &&
      vars.CLUSTER_ADMIN_ARN != '' && vars.AWS_REGION != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load pinned tool versions
        run: grep -E '^[A-Z_]+=' ../../tool-versions.env >> "$GITHUB_ENV"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: terraform init (S3 backend)
        run: >-
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=main/terraform.tfstate"
          -backend-config="region=${{ vars.AWS_REGION }}"
          -backend-config="use_lockfile=true"
      - name: terraform plan (read-only, no lock)
        run: >-
          terraform plan -lock=false -input=false -no-color -out=tfplan
          -var "region=${{ vars.AWS_REGION }}"
          -var "admin_principal_arn=${{ vars.CLUSTER_ADMIN_ARN }}"
      - name: Plan to job summary
        run: |
          {
            echo '## terraform plan (infra/main)'
            echo '```'
            terraform show -no-color tfplan | head -c 60000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
