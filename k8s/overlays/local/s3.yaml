# Local S3 (MinIO, Chainguard image pinned by digest). Data lives in an emptyDir: if this pod
# restarts the bucket is gone; re-run the qr-s3-init Job (delete it and re-apply the overlay).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qr-s3
  labels:
    app.kubernetes.io/name: qr-s3
    app.kubernetes.io/component: storage
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: qr-s3
      app.kubernetes.io/component: storage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qr-s3
        app.kubernetes.io/component: storage
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: qr-s3
          image: cgr.dev/chainguard/minio@sha256:16b824a0016ffad3dfa8b059755f83800aa42ca68fe86f1782cabd0c5a16d322
          # The image entrypoint is minio; distroless, so no shell and httpGet probes only.
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - name: http
              containerPort: 9000
              protocol: TCP
            - name: console
              containerPort: 9001
              protocol: TCP
          env:
            - name: HOME
              value: /tmp
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: qr-s3-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: qr-s3-credentials
                  key: AWS_SECRET_ACCESS_KEY
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Dev-only pod: rootfs left writable (MinIO writes config under $HOME and /data).
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 1Gi
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: qr-s3
  labels:
    app.kubernetes.io/name: qr-s3
    app.kubernetes.io/component: storage
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: qr-s3
    app.kubernetes.io/component: storage
  ports:
    - name: http
      port: 9000
      targetPort: http
      protocol: TCP
    - name: console
      port: 9001
      targetPort: console
      protocol: TCP
