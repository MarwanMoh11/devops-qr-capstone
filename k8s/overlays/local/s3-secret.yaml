# DEV-ONLY credentials for the in-cluster MinIO on kind (values from docs/DESIGN.md §10).
# Never used on EKS, which uses Pod Identity.
apiVersion: v1
kind: Secret
metadata:
  name: qr-s3-credentials
  labels:
    app.kubernetes.io/name: qr-s3
    app.kubernetes.io/component: storage
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: qrlocal
  AWS_SECRET_ACCESS_KEY: qrlocal-dev-only
