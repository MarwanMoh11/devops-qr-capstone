# kind create cluster --config k8s/kind/cluster.yaml
# Node image from the kind v0.33.0 release notes (Kubernetes v1.36.4).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: qr-kind
nodes:
  - role: control-plane
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
    extraPortMappings:
      # http://localhost:8080 -> qr-web NodePort 30080
      - containerPort: 30080
        hostPort: 8080
        listenAddress: "127.0.0.1"
        protocol: TCP
