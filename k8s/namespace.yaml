# Applied by admin scripts (kubectl apply -f k8s/namespace.yaml), NOT part of any kustomization:
# the CI deploy role is namespace-scoped and cannot create namespaces.
apiVersion: v1
kind: Namespace
metadata:
  name: qr-app
  labels:
    app.kubernetes.io/part-of: devops-qr
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
