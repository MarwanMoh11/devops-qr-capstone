# kubectl apply -k monitoring/   (after the kps Helm release exists)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

configMapGenerator:
  - name: qr-dashboards
    files:
      - qr-services.json=dashboards/qr-services.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
        app.kubernetes.io/part-of: devops-qr
